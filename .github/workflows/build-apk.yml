
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BreakReleaseAndroidProject.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -q BreakReleaseAndroidProject.zip

      - name: Build debug APK
        working-directory: BreakReleaseAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BreakRelease-debug-APK
          path: BreakReleaseAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
